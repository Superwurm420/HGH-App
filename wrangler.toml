name = "hgh-app"
main = ".open-next/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Frontend und API laufen in diesem einen Worker. Die Seiten sind Server
# Components und lesen über die Bindings unten direkt aus D1 und R2; die
# Route Handlers unter src/app/api/ bedienen den Adminbereich.

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
# Benutzername für den Adminbereich. Das Passwort ist ein Secret:
#   npx wrangler secret put ADMIN_PASSWORD
ADMIN_USER = "redaktion"

[[d1_databases]]
binding = "DB"
database_name = "hgh-app-db"
database_id = "7a6a1570-883f-4cf7-9989-34569a3a04eb"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "hgh-app-content"

[dev]
port = 8788
