name = "hgh-app"
main = ".open-next/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Frontend und API laufen in diesem einen Worker. Die Seiten sind Server
# Components und lesen über die Bindings unten direkt aus D1 und R2; die
# Route Handlers unter src/app/api/ bedienen den Adminbereich.

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
# Benutzername für den Adminbereich. Ein Passwort wird hier nicht hinterlegt:
# Der erste Login mit diesem Namen und dem Standardpasswort "admin" legt das
# Konto an; ein eigenes Passwort vergibt die Redaktion direkt danach im
# Adminbereich — vorher lässt der Adminbereich nichts anderes zu.
# Beim Anmelden wird die Groß-/Kleinschreibung des Namens nicht beachtet.
ADMIN_USER = "Admin"

[[d1_databases]]
binding = "DB"
database_name = "hgh-app-db"
database_id = "7a6a1570-883f-4cf7-9989-34569a3a04eb"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "hgh-app-content"

[dev]
port = 8788
