name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Fängt unter anderem Next-API-Änderungen ab (z. B. searchParams als
      # Promise) — genau die Klasse Fehler, die den Build zuletzt lahmgelegt hat.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build (OpenNext)
        run: npm run build

      # Frontend und API laufen in einem Worker: ein Deploy genügt.
      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Migrationen laufen nach dem Deploy, damit neue Tabellen bereitstehen,
      # sobald der Code sie erwartet. Ohne diesen Schritt bleibt die Datenbank
      # leer — die Ursache dafür, dass die App zuletzt nichts anzeigen konnte.
      - name: Datenbank migrieren
        run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
