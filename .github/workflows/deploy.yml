name: CI & Deploy

on:
  push:
    branches:
      - main
  # Pull Requests durchlaufen dieselben Prüfungen wie main — nur ohne Deploy.
  # Vorher lief die Prüfkette erst NACH dem Merge: Ein kaputter Build fiel damit
  # frühestens auf, wenn er schon auf main lag.
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Pro Branch bzw. PR nur ein Lauf. Ein neuer Push macht den vorherigen Lauf
# hinfällig — außer auf main, wo ein angefangener Deploy zu Ende laufen muss.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Prüfen und deployen
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Fängt unter anderem Next-API-Änderungen ab (z. B. searchParams als
      # Promise) — genau die Klasse Fehler, die den Build zuletzt lahmgelegt hat.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build (OpenNext)
        run: npm run build

      # Ab hier nur noch auf main. Bei einem Pull Request endet der Lauf nach dem
      # Build — geprüft wird alles, veröffentlicht nichts.
      # Frontend und API laufen in einem Worker: ein Deploy genügt.
      - name: Deploy
        if: github.event_name != 'pull_request'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Migrationen laufen nach dem Deploy, damit neue Tabellen bereitstehen,
      # sobald der Code sie erwartet. Ohne diesen Schritt bleibt die Datenbank
      # leer — die Ursache dafür, dass die App zuletzt nichts anzeigen konnte.
      - name: Datenbank migrieren
        if: github.event_name != 'pull_request'
        run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
